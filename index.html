<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consolas de Videojuegos</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" type="text/css" href="./styles.css"/>

</head>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
      function Tarjeta (props) {
          const [cantidad, setCantidad] = useState(0);

          const incrementar = () => setCantidad(prev => prev + 1);
          const decrementar = () => setCantidad(prev => (prev > 0 ? prev - 1 : 0));
          const resetear = () => setCantidad(0);

          return (
            <div className="card-container">
              <div className="card">
                  <img src={props.imagen}/>
                  <h2>{props.nombre}</h2>
                  <p>{props.descripcion}</p>
                  <div className="count">Cantidad: {cantidad}</div>
                  <div className="counter">
                      <button onClick={decrementar}>-</button>
                      <button onClick={resetear}>Reset</button>
                      <button onClick={incrementar}>+</button>
                  </div>
              </div>
            </div>
          );
      }
      const consolas = [
        {
          id: 1, 
          nombre: 'Play Station 5', 
          desc: 'La PlayStation 5 eleva tu forma de jugar con potencia, velocidad y realismo nunca antes vistos. Disfruta de gráficos en 4K, tiempos de carga casi instantáneos y una experiencia envolvente. ', 
          img: './img/ps5.png' 
        },
        {
          id: 2,
          nombre: 'Nintendo Switch',
          desc: 'La Nintendo Switch es la consola versátil que se adapta a tu estilo de vida. Juega donde quieras y como quieras: en casa en tu TV, en modo portátil o en modo tabletop con sus controles Joy-Con desmontables.',
          img: './img/nintendo.jpg'
        },
        { id: 3, 
          nombre: 'Xbox Series X', 
          desc: 'La Xbox Series X es la consola más potente de Microsoft, diseñada para ofrecer una experiencia de juego fluida, rápida y totalmente inmersiva. Disfruta de gráficos en 4K reales.', 
          img: './img/seriexx.png' }
      ]

      function App (){
        return (
            <div className="parent-card">
              {consolas.map((consola) =>
                <Tarjeta key={consola.id} imagen={consola.img} nombre={consola.nombre} descripcion={consola.desc}/>
              )}
            </div>
        );
      }
      ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
